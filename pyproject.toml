[build-system]
requires = ["setuptools>=61.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vibes"
version = "0.6.12"
description = "Slack-like SPA for interacting with coding agents via ACP protocol"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "aiohttp==3.14.3",
    "aiosqlite==0.22.1",
    "pillow==12.3.0",
    "python-dotenv==1.2.3",
    "watchfiles==1.2.0",
]

[project.optional-dependencies]
dev = [
    "pytest==9.1.1",
    "pytest-asyncio==1.4.0",
    "pytest-aiohttp==1.1.1",
    "ruff==0.16.6",
]

[project.scripts]
vibes = "vibes.app:main"

[project.urls]
Homepage = "https://github.com/rcarmo/vibes"
Repository = "https://github.com/rcarmo/vibes"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
vibes = ["static/**/*", "extensions/*.ts"]

# Keep lint policy local: do not inherit workspace/parent Ruff settings.
[tool.ruff.lint]
select = ["E4", "E7", "E9", "F"]
