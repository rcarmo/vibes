name: UX Tests (BDD/Playwright)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  models: read

jobs:
  ux-tests:
    name: BDD User Stories (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend dependencies
        run: bun install

      - name: Build frontend bundle
        run: bun run build.js

      - name: Build vibes binary
        run: go build -ldflags "-s -w" -o vibes ./cmd/vibes/

      - name: Install Playwright browsers
        run: bunx playwright install chromium --with-deps

      - name: Install ACP agents
        run: |
          npm install -g @github/copilot-language-server opencode-ai
          echo "copilot-language-server: $(copilot-language-server --version 2>/dev/null || echo installed)"
          echo "opencode: $(opencode --version 2>/dev/null || echo installed)"

      - name: Configure GitHub Models for Copilot ACP
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # GitHub Models auth: $GITHUB_TOKEN is auto-available in runners
          # copilot-language-server uses it for model access
          echo "GITHUB_TOKEN is set: $([ -n "$GITHUB_TOKEN" ] && echo yes || echo no)"
          # Set GH_COPILOT_TOKEN for copilot-language-server
          echo "GH_COPILOT_TOKEN=$GITHUB_TOKEN" >> "$GITHUB_ENV"
          echo "GITHUB_COPILOT_TOKEN=$GITHUB_TOKEN" >> "$GITHUB_ENV"

      - name: Start vibes server with Copilot ACP (GitHub Models)
        env:
          VIBES_PORT: "8765"
          VIBES_ACP_AGENT: "copilot-language-server --acp --stdio"
          VIBES_DB_PATH: /tmp/vibes-bdd-test.db
          VIBES_DEBUG: "true"
        run: |
          ./vibes > /tmp/vibes-bdd.log 2>&1 &
          echo $! > /tmp/vibes.pid
          sleep 5
          curl -fsS http://127.0.0.1:8765/health || { echo "=== Server log ==="; cat /tmp/vibes-bdd.log; exit 1; }
          echo "Vibes server started (PID $(cat /tmp/vibes.pid))"

      - name: Run all BDD Playwright tests
        env:
          VIBES_TEST_URL: "http://127.0.0.1:8765"
        run: bunx playwright test || true

      - name: Generate PDF + HTML test report
        if: always()
        run: |
          node scripts/generate-report-pdf.mjs --output test-results/vibes-ux-report.pdf
          ls -lh test-results/vibes-ux-report.* 2>/dev/null || true

      - name: Stop vibes server
        if: always()
        run: |
          if [ -f /tmp/vibes.pid ]; then
            kill "$(cat /tmp/vibes.pid)" 2>/dev/null || true
          fi

      - name: Upload PDF + HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux-test-report
          path: |
            test-results/vibes-ux-report.pdf
            test-results/vibes-ux-report.html
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload screenshots, videos, and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux-test-evidence
          path: |
            test-results/**/*.png
            test-results/**/*.webm
            test-results/**/*.zip
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux-test-playwright-report
          path: playwright-report/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload raw results JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux-test-results-json
          path: test-results/results.json
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload server log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vibes-server-log
          path: /tmp/vibes-bdd.log
          retention-days: 7
