name: UX Tests (BDD/Playwright)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ux-tests:
    name: BDD User Stories (Playwright)
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true
    timeout-minutes: 25

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Bun
        run: curl -fsSL https://bun.sh/install | bash && echo "$HOME/.bun/bin" >> $GITHUB_PATH

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend dependencies
        run: bun install

      - name: Build frontend bundle
        run: bun run build.js

      - name: Build vibes binary
        run: go build -ldflags "-s -w" -o vibes ./cmd/vibes/

      - name: Install Playwright browsers
        run: bunx playwright install chromium --with-deps

      - name: Install OpenCode (ACP agent with free ZEN models)
        run: |
          npm install -g opencode-ai
          echo "OpenCode version: $(opencode --version)"
          echo "Available free models:"
          opencode models 2>/dev/null || true

      - name: Configure and verify OpenCode ACP
        run: |
          # Run opencode once to trigger database migration
          opencode models 2>/dev/null || true
          # Verify ACP handshake works
          echo '{"jsonrpc":"2.0","id":1,"method":"initialize","params":{"protocolVersion":1,"clientInfo":{"name":"ci","version":"0.1.0"},"clientCapabilities":{}}}' | timeout 10 opencode acp 2>/dev/null | head -c 200
          echo
          echo "OpenCode ACP handshake OK"

      - name: Start vibes server with OpenCode ACP
        env:
          VIBES_PORT: "8765"
          VIBES_ACP_AGENT: "opencode acp"
          VIBES_ACP_DEBUG: "true"
          VIBES_DB_PATH: /tmp/vibes-bdd-test.db
          VIBES_DEBUG: "true"
        run: |
          ./vibes > /tmp/vibes-bdd.log 2>&1 &
          echo $! > /tmp/vibes.pid
          sleep 5
          for i in 1 2 3 4 5; do
            curl -fsS http://127.0.0.1:8765/health && break || sleep 2
          done
          curl -fsS http://127.0.0.1:8765/health || { echo "=== Server log ==="; cat /tmp/vibes-bdd.log; exit 1; }
          echo "Vibes server started (PID $(cat /tmp/vibes.pid))"
          echo "Server log tail:"
          tail -5 /tmp/vibes-bdd.log

      - name: Run ALL BDD Playwright tests
        env:
          VIBES_TEST_URL: "http://127.0.0.1:8765"
        run: |
          bunx playwright test 2>&1 | tee /tmp/playwright-output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          echo "Playwright exit code: $EXIT_CODE"
          # Fail the step only if tests actually errored (not just some failures)
          exit $EXIT_CODE

      - name: Generate PDF + HTML test report
        if: always()
        run: |
          node scripts/generate-report-pdf.mjs --output test-results/vibes-ux-report.pdf
          ls -lh test-results/vibes-ux-report.* 2>/dev/null || true

      - name: Print test summary
        if: always()
        run: |
          if [ -f test-results/results.json ]; then
            node -e "
              const d = require('./test-results/results.json');
              const s = d.stats || {};
              console.log('=== Test Summary ===');
              console.log('Passed:', s.expected || 0);
              console.log('Failed:', s.unexpected || 0);
              console.log('Skipped:', s.skipped || 0);
              console.log('Total:', (s.expected||0) + (s.unexpected||0) + (s.skipped||0));
              console.log('Duration:', ((s.duration||0)/1000).toFixed(1) + 's');
            "
          fi

      - name: Stop vibes server
        if: always()
        run: |
          if [ -f /tmp/vibes.pid ]; then
            kill "$(cat /tmp/vibes.pid)" 2>/dev/null || true
          fi

      - name: Upload PDF + HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux-test-report
          path: |
            test-results/vibes-ux-report.pdf
            test-results/vibes-ux-report.html
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload screenshots, videos, and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux-test-evidence
          path: |
            test-results/**/*.png
            test-results/**/*.webm
            test-results/**/*.zip
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload Playwright HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux-test-playwright-report
          path: playwright-report/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload raw results JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux-test-results-json
          path: test-results/results.json
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload server log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: vibes-server-log
          path: /tmp/vibes-bdd.log
          retention-days: 7
