name: UX Tests (BDD/Playwright)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

jobs:
  ux-tests:
    name: BDD User Stories (Playwright)
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install frontend dependencies
        run: bun install

      - name: Build frontend bundle
        run: bun run build.js

      - name: Build vibes binary
        run: go build -ldflags "-s -w" -o vibes ./cmd/vibes/

      - name: Install Playwright browsers
        run: bunx playwright install chromium --with-deps

      - name: Start vibes server (no agent — API and UI structure tests)
        env:
          VIBES_PORT: "8765"
          VIBES_ACP_AGENT: ""
          VIBES_DB_PATH: /tmp/vibes-bdd-test.db
          VIBES_DEBUG: "true"
        run: |
          ./vibes > /tmp/vibes-bdd.log 2>&1 &
          echo $! > /tmp/vibes.pid
          sleep 3
          curl -fsS http://127.0.0.1:8765/health || { cat /tmp/vibes-bdd.log; exit 1; }
          echo "Vibes server started (PID $(cat /tmp/vibes.pid))"

      - name: Run BDD Playwright tests
        env:
          VIBES_TEST_URL: "http://127.0.0.1:8765"
        run: |
          bunx playwright test \
            tests/steps/api-endpoints.spec.mjs \
            tests/steps/page-load.spec.mjs \
            tests/steps/timeline.spec.mjs \
            tests/steps/workspace.spec.mjs \
            tests/steps/media.spec.mjs \
            tests/steps/permissions.spec.mjs \
            tests/steps/link-preview.spec.mjs \
            tests/steps/agent-switching.spec.mjs \
            tests/steps/compose-and-theme.spec.mjs \
          || true
          echo "Note: agent-conversation and slash-commands tests require a running ACP agent and are skipped in CI without credentials."

      - name: Generate PDF test report
        if: always()
        run: |
          node scripts/generate-report-pdf.mjs --output test-results/vibes-ux-report.pdf || {
            echo "PDF generation failed; creating placeholder"
            mkdir -p test-results
            echo "PDF generation failed. Check test-results/results.json and playwright-report/ for details." > test-results/vibes-ux-report.txt
          }

      - name: Stop vibes server
        if: always()
        run: |
          if [ -f /tmp/vibes.pid ]; then
            kill "$(cat /tmp/vibes.pid)" 2>/dev/null || true
          fi

      - name: Upload PDF report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux-test-report-pdf
          path: |
            test-results/vibes-ux-report.pdf
            test-results/vibes-ux-report.txt
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload screenshots and traces
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux-test-evidence
          path: |
            test-results/**/*.png
            test-results/**/*.webm
            test-results/**/*.zip
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload HTML report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux-test-report-html
          path: playwright-report/
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload test results JSON
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ux-test-results-json
          path: test-results/results.json
          retention-days: 30
          if-no-files-found: ignore

      - name: Upload server log (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: vibes-server-log
          path: /tmp/vibes-bdd.log
          retention-days: 7
